name: Hourly Discord Post

on:
  schedule:
    # Runs at minute 0 of every hour, in UTC.
    # Adjust if you want it aligned to a different timezone.
    - cron: '0 * * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post to Discord channels
        run: python post.py
        env:
          # Add one line per channel. The names just need to start with WEBHOOK_.
          WEBHOOK_CHANNEL_1: ${{ secrets.WEBHOOK_CHANNEL_1 }}
          WEBHOOK_CHANNEL_2: ${{ secrets.WEBHOOK_CHANNEL_2 }}
          WEBHOOK_CHANNEL_3: ${{ secrets.WEBHOOK_CHANNEL_3 }}
